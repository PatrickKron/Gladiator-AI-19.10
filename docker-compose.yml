name: gladiator-v2

services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: gladiator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gladiator
      POSTGRES_USER: gladiator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein (kein Fallback)}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gladiator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gladiator -d gladiator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gladiator-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - gladiator_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: die App selbst als Container (nur mit `--profile app`). Ohne Profil
  # startet Compose wie bisher nur Datenbank + Redis.
  app:
    profiles: ["app"]
    build: .
    image: gladiator-app
    container_name: gladiator-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Host-Netz: dieselbe .env wie ohne Container (DB 127.0.0.1:5433, Redis 6380, API nur
    # auf 127.0.0.1:3010). So sieht die App echte Client-Adressen (Auto-Login nur
    # localhost/Tailnet, Stream-Limit je Gerät) statt der Docker-Bridge — nie offen ins Internet.
    network_mode: host
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  gladiator_pgdata:
  gladiator_redisdata:
